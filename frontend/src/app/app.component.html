<div class="chat">
  <div class="header">
    <h2>RAG Chat</h2>
    <button type="button" (click)="newChat()" [disabled]="loading()">New chat</button>
  </div>

  <div class="messages">
    @for (msg of messages(); track $index) {
      @for (tool of msg.tools ?? []; track $index) {
        <div class="tool">🔧 {{ tool.name }}({{ formatArgs(tool.args) }}) → {{ tool.result }}</div>
      }
      <div [class]="msg.role">{{ msg.text }}</div>
    }
    @if (loading()) {
      <div class="bot">Thinking...</div>
    }
  </div>

  <form (ngSubmit)="send()" class="input-row">
    <input [(ngModel)]="question" name="question" placeholder="Ask a question..." />
    <button type="submit" [disabled]="loading()">Send</button>
  </form>
</div>
