[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nirmalganesh15", email = "nirmalaws15@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.146.0",
    "fastembed>=0.9.0",
    "langchain>=1.4.6",
    "langchain-anthropic>=1.7.6",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "pymupdf>=2.0",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag = "rag:main"
rag-server = "rag.server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipython>=9.17.1",
]
